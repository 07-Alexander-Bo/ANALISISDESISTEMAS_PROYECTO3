version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: aquacontrol_db
    restart: always
    environment:
      POSTGRES_USER: aquauser
      POSTGRES_PASSWORD: aquapass
      POSTGRES_DB: aquacontrol
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquauser -d aquacontrol"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: aquacontrol_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://aquauser:aquapass@db:5432/aquacontrol
      NODE_ENV: production
    ports:
      - '4000:4000'

  frontend:
    build: ./frontend
    container_name: aquacontrol_web
    restart: always
    depends_on:
      - backend
    ports:
      - '3000:80'

volumes:
  pgdata:
